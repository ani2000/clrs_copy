name: EC2 diagnose (read-only)

# Manual trigger only. Read-only inspection of the instance tagged
# Name=clrs-circuit-tracer AND Project=clrs-circuit-tracer: status, ECR image
# age, CPU credits and (via SSM Run Command) container logs and memory.
# Creates/modifies nothing.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # only used when the AWS_ROLE_ARN repo variable is set (OIDC)

env:
  AWS_DEFAULT_REGION: us-east-1
  NAME: clrs-circuit-tracer
  PROJECT: clrs-circuit-tracer

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: AWS credentials (OIDC role)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: AWS credentials (access keys)
        if: ${{ vars.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: ECR image info
        run: aws ecr describe-images --repository-name "$NAME" --query 'imageDetails[].[imageTags,imagePushedAt,imageSizeInBytes]' --output text

      - name: Instance status, CPU credits, memory and logs
        run: |
          set -euo pipefail
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME" "Name=tag:Project,Values=$PROJECT" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          [ "$id" != "None" ] || { echo "no running tagged instance"; exit 1; }
          aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[].Instances[].[InstanceId,LaunchTime,PublicIpAddress]' --output text
          aws ec2 describe-instance-credit-specifications --instance-ids "$id" --query 'InstanceCreditSpecifications[].CpuCredits' --output text || true
          for m in CPUCreditBalance CPUUtilization; do
            echo "== $m (5-min avg, last hour) =="
            aws cloudwatch get-metric-statistics --namespace AWS/EC2 --metric-name $m \
              --dimensions Name=InstanceId,Value="$id" \
              --start-time "$(date -u -d '1 hour ago' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" \
              --period 300 --statistics Average --query 'sort_by(Datapoints,&Timestamp)[].[Timestamp,Average]' --output text || true
          done
          cmd=$(aws ssm send-command --instance-ids "$id" --document-name AWS-RunShellScript \
            --parameters 'commands=["docker ps -a","echo ---LOGS---","docker logs --tail 60 tracer 2>&1","echo ---MEM---","free -m","swapon -s","top -b -n1 | head -15","dmesg | grep -i -E \"out of memory|killed process\" | tail -5"]' \
            --query Command.CommandId --output text)
          sleep 20
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
