name: AWS discovery (read-only)

# Manual trigger only. Runs only read-only aws CLI commands (describe/list/get)
# against us-east-1 -- nothing here creates, modifies, deletes, or launches
# any resource. Requires repo secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# for an IAM user with at least read access to ec2/ecr/iam.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: ECR repositories
        run: aws ecr describe-repositories --region us-east-1 || true

      - name: VPCs
        run: aws ec2 describe-vpcs --region us-east-1

      - name: Subnets in us-east-1a
        run: |
          aws ec2 describe-subnets --region us-east-1 \
            --filters Name=availability-zone,Values=us-east-1a

      - name: Key pairs
        run: aws ec2 describe-key-pairs --region us-east-1

      - name: Security groups
        run: aws ec2 describe-security-groups --region us-east-1

      - name: Tagged EC2 instances
        run: aws ec2 describe-instances --region us-east-1

      - name: Instance profiles
        run: aws iam list-instance-profiles
