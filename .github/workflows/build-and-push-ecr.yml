name: Build and push image to ECR

# Manual trigger only. Builds the two-server container for linux/amd64 and
# pushes it to Amazon ECR in us-east-1. ECR repository creation only happens
# if you explicitly set create_repo_if_missing=true when running this
# workflow -- that is the one mutating AWS call here, and it only runs
# because you deliberately chose that input, not automatically.
on:
  workflow_dispatch:
    inputs:
      create_repo_if_missing:
        description: 'Create the ECR repository if it does not already exist'
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  ECR_REPO: clrs-circuit-tracer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify checkpoints are real files, not LFS pointers
        run: |
          test "$(stat -c%s checkpoints_v3/bfs/best.pkl)" -gt 100000

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create ECR repository (only if requested)
        if: ${{ inputs.create_repo_if_missing }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" \
            || aws ecr create-repository --repository-name "$ECR_REPO" --image-scanning-configuration scanOnPush=true

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:latest

      - name: Print image URI
        run: echo "Pushed ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:latest" >> "$GITHUB_STEP_SUMMARY"
