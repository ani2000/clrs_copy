name: Deploy to EC2 (one instance)

# Manual trigger only, and does nothing unless you type "confirmed".
# Creates exactly: 1 key pair, 1 security group, 1 instance (t3.micro or t3.small)
# (us-east-1a, default VPC subnet). Uses an EXISTING instance profile; never
# creates or edits IAM, VPCs, subnets, gateways or route tables, and never
# touches any other resource. Run "Build and push image to ECR" first.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "confirmed" to allow creating AWS resources'
        required: true
        default: ''
      ssh_cidr:
        description: 'Optional CIDR for SSH (port 22), e.g. 203.0.113.5/32. Empty = SSH closed'
        required: false
        default: ''
      instance_type:
        description: 'Instance type for the new instance'
        type: choice
        options: [t3.small, t3.micro]
        default: t3.small
      replace_existing:
        description: 'TERMINATE the existing clrs-circuit-tracer instance (and only it) before launching a new one'
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-1
  ECR_REPO: clrs-circuit-tracer
  SUBNET_ID: subnet-0522fa9c6ad614895
  VPC_ID: vpc-0ae7737cdd3571324
  PROFILE: ecsInstanceProfile
  NAME: clrs-circuit-tracer

jobs:
  deploy:
    if: ${{ inputs.confirm == 'confirmed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Pre-checks
        run: |
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$NAME" "Name=instance-state-name,Values=pending,running,stopped,stopping" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$ids" ]; then
            if [ "${{ inputs.replace_existing }}" = "true" ]; then
              echo "Terminating existing $NAME instance: $ids"
              aws ec2 terminate-instances --instance-ids $ids >/dev/null
              aws ec2 wait instance-terminated --instance-ids $ids
            else
              echo "An instance named $NAME already exists; set replace_existing to replace it."; exit 1
            fi
          fi
          aws ecr describe-images --repository-name "$ECR_REPO" --image-ids imageTag=latest >/dev/null \
            || { echo "ECR image $ECR_REPO:latest not found; run the build workflow first."; exit 1; }
          role=$(aws iam get-instance-profile --instance-profile-name "$PROFILE" --query 'InstanceProfile.Roles[0].RoleName' --output text)
          aws iam list-attached-role-policies --role-name "$role" --query 'AttachedPolicies[].PolicyName' --output text | tee /tmp/pols
          grep -Eqi 'ContainerRegistry|ContainerServiceforEC2|ECR' /tmp/pols \
            || { echo "Role $role has no obvious ECR read policy; stopping."; exit 1; }

      - name: Create key pair if missing (private key kept out of logs)
        run: |
          aws ec2 describe-key-pairs --key-names "${NAME}-key" >/dev/null 2>&1 && { echo "key pair exists, reusing"; exit 0; }
          aws ec2 create-key-pair --key-name "${NAME}-key" --key-type ed25519 \
            --query KeyMaterial --output text > "${NAME}-key.pem"
          chmod 600 "${NAME}-key.pem"

      - name: Upload private key (private artifact, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-key
          path: ${{ env.NAME }}-key.pem
          retention-days: 1
          if-no-files-found: ignore

      - name: Create security group if missing
        id: sg
        run: |
          sg=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=${NAME}-sg" "Name=vpc-id,Values=$VPC_ID" --query 'SecurityGroups[0].GroupId' --output text)
          if [ "$sg" != "None" ]; then echo "sg=$sg" >> "$GITHUB_OUTPUT"; exit 0; fi
          sg=$(aws ec2 create-security-group --group-name "${NAME}-sg" \
            --description "clrs circuit tracer" --vpc-id "$VPC_ID" --query GroupId --output text)
          aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 80 --cidr 0.0.0.0/0
          aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 8080 --cidr 0.0.0.0/0
          if [ -n "${{ inputs.ssh_cidr }}" ]; then
            aws ec2 authorize-security-group-ingress --group-id "$sg" --protocol tcp --port 22 --cidr "${{ inputs.ssh_cidr }}"
          fi
          echo "sg=$sg" >> "$GITHUB_OUTPUT"

      - name: Launch instance
        run: |
          ami=$(aws ec2 describe-images --owners amazon \
            --filters "Name=name,Values=al2023-ami-2023*-x86_64" "Name=state,Values=available" \
            --query 'sort_by(Images,&CreationDate)[-1].ImageId' --output text)
          acct=$(aws sts get-caller-identity --query Account --output text)
          reg="$acct.dkr.ecr.us-east-1.amazonaws.com"
          cat > userdata.sh <<EOF
          #!/bin/bash
          set -x
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          dnf install -y docker
          systemctl enable --now docker
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $reg
          docker pull $reg/$ECR_REPO:latest
          docker run -d --restart always --name tracer -p 80:8766 -p 8080:8767 $reg/$ECR_REPO:latest
          EOF
          id=$(aws ec2 run-instances --image-id "$ami" --instance-type ${{ inputs.instance_type }} --count 1 \
            --subnet-id "$SUBNET_ID" --security-group-ids "${{ steps.sg.outputs.sg }}" \
            --key-name "${NAME}-key" --iam-instance-profile Name="$PROFILE" \
            --metadata-options HttpTokens=required,HttpPutResponseHopLimit=2 \
            --block-device-mappings 'DeviceName=/dev/xvda,Ebs={VolumeSize=16,VolumeType=gp3,DeleteOnTermination=true}' \
            --user-data file://userdata.sh \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=$NAME}]" \
            --query 'Instances[0].InstanceId' --output text)
          aws ec2 wait instance-running --instance-ids "$id"
          ip=$(aws ec2 describe-instances --instance-ids "$id" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "Instance $id at http://$ip/viewer3.html (figures: http://$ip:8080/viewer_fig47.html). Allow ~5 min for boot + image pull + model load." >> "$GITHUB_STEP_SUMMARY"
          echo "Instance $id, public IP $ip"
